# Lo stack di SVILUPPO: database, posta, API e dashboard, con ricarica a caldo.
#
#   docker compose up --build        poi http://localhost:5173
#
# Si possono ancora lanciare API e dashboard a mano (`python -m backend.api`,
# `npm run dev`) e tenere qui solo db e mail: `docker compose up db mail`.
# Le due cose non convivono sulle stesse porte, 8000 e 5173.
#
# COSA NON C'E' QUI, E NON E' UNA DIMENTICANZA: la pipeline. `predict_round` e
# `close_round` scrivono il track record, e quel registro vale solo se lo
# scrive un processo locale prima del fischio. Restano sulla macchina; i
# container qui sotto LEGGONO soltanto, e i montaggi di `data/` e
# `track_record/` sono in sola lettura anche in sviluppo — una regola che vale
# solo in produzione non e' una regola, e' una speranza.
#
# Produzione: `compose.prod.yaml`, stessa immagine dell'API, dashboard come
# bundle statico dietro Caddy.

name: ai-naples

services:
  db:
    # pgvector/pgvector e non postgres: e' l'immagine ufficiale di Postgres con
    # pgvector gia' compilato dentro. Serve piu' avanti per la ricerca
    # semantica sui dati di partita (ADR 0002); installarlo ora costa zero e
    # evita di dover ricreare il volume quando servira'.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ainaples}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?serve POSTGRES_PASSWORD, copia .env.example in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ainaples}
      # Le collazioni deterministiche evitano che l'ordinamento cambi con la
      # locale del sistema: due macchine con locale diversa darebbero indici
      # diversi sulla stessa tabella.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und-x-icu"
    ports:
      # La porta sull'HOST e' configurabile di proposito: se un giorno c'e'
      # gia' un altro Postgres in ascolto, si cambia POSTGRES_PORT nel proprio
      # .env invece di modificare questo file. Scoprire il conflitto con un
      # "connection refused" verso il database sbagliato e' il modo peggiore.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Gli script in initdb.d girano SOLO alla prima creazione del volume.
      # Non sono migrazioni e non vanno usati come tali: le migrazioni sono
      # Alembic. Qui stanno solo le estensioni, che devono esserci prima che
      # la prima migrazione parta.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `pg_isready` da solo dice che il processo risponde, non che il database
      # accetta query: durante l'init il server e' su ma il db non c'e' ancora.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ainaples} -d ${POSTGRES_DB:-ainaples}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mail:
    # Mailpit e non MailHog: MailHog e' fermo dal 2020, Mailpit e' il suo
    # successore mantenuto e ha un'API REST, quindi un test puo' CHIEDERE se
    # il messaggio e' arrivato invece di fidarsi che l'invio non abbia sollevato.
    #
    # NON E' UN PROVIDER, E NON DEVE DIVENTARLO. Cattura tutto e non consegna
    # niente: e' esattamente cio' che serve in sviluppo, dove mandare per
    # sbaglio una mail vera a un indirizzo di prova e' un incidente possibile.
    # In produzione al suo posto va un provider vero, e l'applicazione non se
    # ne accorge: cambia solo AI_NAPLES_SMTP_* (vedi .env.example).
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"   # SMTP: qui scrive l'applicazione
      - "${MAILPIT_UI_PORT:-8025}:8025"     # web UI + API REST: qui si legge
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - mail_data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    # La STESSA immagine della produzione (backend/Dockerfile), con i sorgenti
    # montati sopra e uvicorn in --reload. Un'immagine di sviluppo separata
    # divergerebbe da quella che va in produzione, e i problemi d'immagine —
    # un pacchetto mancante, un percorso sbagliato — si vedrebbero solo li'.
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # goalmodel ricava i percorsi da questa radice: senza, nell'immagine
      # punterebbero dentro il virtualenv (vedi compose.prod.yaml).
      AI_NAPLES_ROOT: /srv
      # I sorgenti montati vincono sul pacchetto installato nell'immagine: i
      # percorsi in PYTHONPATH precedono site-packages.
      PYTHONPATH: /srv/src:/srv
      # Dentro la rete di compose l'host e' il nome del servizio, mai
      # 127.0.0.1 — che in un container e' il container stesso.
      AI_NAPLES_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ainaples}:${POSTGRES_PASSWORD:?serve POSTGRES_PASSWORD, copia .env.example in .env}@db:5432/${POSTGRES_DB:-ainaples}
      AI_NAPLES_SECRET_KEY: ${AI_NAPLES_SECRET_KEY:?serve AI_NAPLES_SECRET_KEY, copia .env.example in .env}
      AI_NAPLES_COOKIE_SECURE: "0"
      AI_NAPLES_PUBLIC_URL: http://localhost:${FRONTEND_PORT:-5173}
      AI_NAPLES_SMTP_HOST: mail
      AI_NAPLES_SMTP_PORT: "1025"
      AI_NAPLES_SMTP_SECURITY: none
      AI_NAPLES_SMTP_FROM: ${AI_NAPLES_SMTP_FROM:-no-reply@ainaples.local}
      # Docker Desktop su Windows non inoltra gli eventi dei file del bind
      # mount: senza polling --reload non ricarica mai.
      WATCHFILES_FORCE_POLLING: "true"
    command: >-
      uvicorn backend.api:app --host 0.0.0.0 --port 8000
      --reload --reload-dir /srv/backend --reload-dir /srv/src
    volumes:
      - ./backend:/srv/backend:ro
      - ./src:/srv/src:ro
      - ./manual:/srv/manual:ro
      - ./data:/srv/data:ro
      - ./track_record:/srv/track_record:ro
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    # Il server di sviluppo Vite. Il browser parla SOLO con lui: le chiamate a
    # /api le gira all'API sulla rete interna (API_PROXY_TARGET), quindi c'e'
    # un'origine sola e il cookie di sessione funziona come in produzione.
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: "1"
    volumes:
      - ./frontend:/app
      # Volume anonimo SOPRA node_modules: la copia della macchina e' compilata
      # per il suo sistema (su Windows esbuild e' un .exe) e nel container non
      # parte. Cosi' resta quella installata da `npm ci` nell'immagine.
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data:
  mail_data:
