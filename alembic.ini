# Alembic. L'URL del database NON sta qui: lo mette `env.py` leggendolo dalle
# impostazioni, che lo prendono dall'ambiente. Una stringa di connessione con
# la password dentro, in un file versionato, e' la regola di sicurezza n.1
# violata nel modo piu' comune che ci sia.
[alembic]
script_location = backend/auth/migrations
prepend_sys_path = .
path_separator = os

# I file di migrazione ordinati per data: con il solo hash, l'ordine sul disco
# non dice niente e trovare "quella di ieri" diventa una ricerca.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
